x-airflow-common:
        &airflow-common
        build:
            context: .
            dockerfile: airflow/Dockerfile
        restart: unless-stopped
        depends_on:
            airflow-init:
                condition: service_completed_successfully
        environment:
            AIRFLOW__CORE__EXECUTOR: LocalExecutor
            AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
            AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
            AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
            AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
            AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
            AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
            #AIRFLOW__FAB__SESSION_BACKEND: securecookie
            AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

            AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
            AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
            AWS_DEFAULT_REGION: ${S3_REGION}

        volumes:
            - ./airflow/dags:/opt/airflow/dags
            - ./airflow/logs:/opt/airflow/logs
            - ./airflow/plugins:/opt/airflow/plugins
            
            - ./ecommerce_dbt:/home/airflow/ecommerce_dbt

            - ./Data:/opt/airflow/Data:ro


services:
    airflow-postgres:
        image: postgres:16
        environment: 
            POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
            POSTGRES_USER: ${AIRFLOW_DB_USER}
            POSTGRES_DB: ${AIRFLOW_DB_NAME}
        restart: unless-stopped 
        healthcheck:
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
            test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
        ports:
            - "5433:5432"
        volumes:
            - ./airflow/airflow-postgres/data:/var/lib/postgresql/data
        


    airflow-init:
        build:
            context: .
            dockerfile: airflow/Dockerfile

        depends_on:
            airflow-postgres:
                condition: service_healthy

        environment:
            AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
            AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
            AIRFLOW__CORE__LOAD_EXAMPLES: "false"
            AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
            AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        entrypoint: /bin/bash
        command: >
            -c " 
            airflow db migrate &&

            airflow users create \
            --username ${AIRFLOW_ADMIN_USER} \
            --firstname ${AIRFLOW_ADMIN_FIRSTNAME} \
            --lastname ${AIRFLOW_ADMIN_LASTNAME} \
            --role ${AIRFLOW_ADMIN_ROLE} \
            --email ${AIRFLOW_ADMIN_EMAIL} \
            --password ${AIRFLOW_ADMIN_PASSWORD}  &&
            echo '✅ Airflow DB initialized successfully.'
            "

    

    airflow-scheduler:
        <<: *airflow-common
        command: scheduler

    airflow-apiserver:
        <<: *airflow-common
        ports:
            - "8080:8080"
        command: api-server

    airflow-dag-processor:
        <<: *airflow-common
        command: dag-processor

    # airflow-triggerer:
    #     <<: *airflow-common
    #     command: triggerer